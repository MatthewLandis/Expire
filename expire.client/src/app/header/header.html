<header>
  <a class="brand" routerLink="/">Expire</a>
  <nav class="btns" aria-label="Account">
    @if (auth.isLogIn()) {
    <span class="display-name">{{ auth.displayName() }}</span>
    <button type="button" (click)="logout()" [disabled]="auth.busy()">
      {{ auth.busy() ? 'Please wait…' : 'Log out' }}
    </button>
    } @else {
    <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Login</a>
    <a routerLink="/signup" routerLinkActive="active" ariaCurrentWhenActive="page">Sign up</a>
    }
  </nav>
</header>
@if (auth.sessionError()) {
<div class="session-error" role="alert">
  {{ auth.sessionError() }}
  <button type="button" (click)="auth.refreshSession()" [disabled]="auth.busy()">Retry</button>
</div>
}
