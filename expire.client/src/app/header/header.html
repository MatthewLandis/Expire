<header>
  <a class="brand" routerLink="/">Expire</a>
  <nav>
    @if (auth.user().authenticated) {
      <a class="fridge-nav" routerLink="/fridge">My Fridge</a>
      <button class="account-button" popovertarget="account-menu">
        <i class="bx bx-user-circle"></i>My Account<i class="bx bx-chevron-down arrow"></i>
      </button>
      <div id="account-menu" popover #accountMenu (click)="accountMenu.hidePopover()">
        <small>Logged in as:</small>
        <p>{{ auth.user().username }}</p>
        <ul>
          <li><a routerLink="/profile"><i class="bx bx-user-circle"></i>My Profile</a></li>
          <li><button (click)="onLogout()"><i class="bx bx-log-out"></i>Log out</button></li>
        </ul>
      </div>
    } @else {
      <a class="login-btn" routerLink="/login">Log In</a>
      <a class="signup-btn" routerLink="/signup">Sign Up</a>
    }
  </nav>
</header>
