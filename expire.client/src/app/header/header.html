<header>
  <a class="brand" routerLink="/">Expire</a>
  <nav class="btns">
    @if (auth.user().authenticated) {
    <div class="header-search">
      <i class="bx bx-search" aria-hidden="true"></i>

      <input type="search"
             placeholder="Search your fridge..."
             aria-label="Search your fridge" />
    </div>
    <button class="fridge-nav" type="button">My Fridge</button>
    <details class="account">
      <summary class="account-button">
        <i class="bx bx-user-circle"></i>
        <span>My Account</span>
        <i class='bx bx-chevron-up'></i>
      </summary>
      <div class="account-dropdown">
        <span class="displayName">{{ auth.user().username }}</span>
        <a routerLink="/profile">My Profile</a>
        <button type="button" (click)="onLogout()">Log out</button>
      </div>
    </details>
    } @else {
    <a routerLink="/login">Log In</a>
    <a routerLink="/signup">Sign Up</a>
    }
  </nav>
</header>
