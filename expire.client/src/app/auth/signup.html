<section>
  <nav>
    <a routerLink="/login">Log In</a>
    <a routerLink="/signup" class="active">Sign Up</a>
  </nav>
  <form #signupForm="ngForm" (ngSubmit)="onSignup()">
    <header>
      <h1>Welcome to Expire!</h1>
      <p>Create your account to track expirations</p>
    </header>
    <div class="field">
      <label for="user">Username</label>
      <i class='bx bx-user'></i>
      <input id="user"
             name="username"
             type="text"
             [(ngModel)]="username"
             placeholder="Enter your username"
             autocomplete="username"
             spellcheck="false"
             required>
    </div>
    <div class="field">
      <label for="pass">Password</label>
      <i class='bx bx-lock'></i>
      <input id="pass"
             name="password"
             type="password"
             [(ngModel)]="password"
             placeholder="Enter your password"
             autocomplete="new-password"
             required>
    </div>
    <div class="requirements">
      <p>Your password must:</p>
      <ul>
        <li>Be 8+ characters long.</li>
        <li>Include uppercase and lowercase characters.</li>
        <li>Include at least one number or symbol.</li>
      </ul>
    </div>
    <button type="submit" [disabled]="signupForm.invalid || isSubmitting()">
      {{ isSubmitting() ? 'Creating account...' : 'Sign Up' }}
    </button>
    @if (message()) {
      <p class="error">{{ message() }}</p>
    }
    <p>Already have an account? <a routerLink="/login">Log In</a></p>
  </form>
</section>
<img src="/imgs/fridge.png" />
